<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>행복탕 사장님 — 동네 목욕탕 경영 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ink:#24323a;--paper:#fffaf2;--red:#d9483b;--gold:#f2b632;--tile:#dff1f7;--grout:#b3d6e2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--ink);background-color:var(--tile);
  background-image:linear-gradient(var(--grout) 2px,transparent 2px),linear-gradient(90deg,var(--grout) 2px,transparent 2px);background-size:34px 34px;user-select:none}
#app{position:relative;max-width:1100px;margin:0 auto;padding:10px 10px 24px}
button,.jua{font-family:'Jua',sans-serif;font-weight:400}

#hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;box-shadow:0 4px 0 var(--ink)}
.sign{font-family:'Jua';font-size:22px;color:#fff;background:var(--red);padding:2px 12px;border-radius:8px;white-space:nowrap}
.stat{font-family:'Jua';font-size:17px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;white-space:nowrap}
.hud-sp{flex:1}
.iconbtn{font-size:18px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 8px;cursor:pointer}
#timebar{height:8px;background:#fff;border:2px solid var(--ink);border-radius:99px;margin:8px 2px 10px;overflow:hidden}
#timebar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd27a,#f08a5d,#7a5cc4)}

#stage{position:relative;height:min(66vh,660px);min-height:380px;border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 5px 0 var(--ink);background:#bfe3f2}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-family:'Jua';font-size:22px;background:#f6e7cf;z-index:5;text-align:center;padding:20px}
.camctl{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:3}
.camctl button{width:38px;height:38px;border:2px solid var(--ink);border-radius:10px;background:rgba(255,255,255,.92);font-size:17px;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.status{position:absolute;left:10px;top:10px;z-index:3;background:rgba(255,250,242,.94);border:2px solid var(--ink);border-radius:10px;padding:4px 10px;font-size:13px;max-width:calc(100% - 160px)}

.tag.vip .wish{background:#fff3b0;border-color:#b8860b}
.tag.jinsang .wish{background:#ffd9d4}
#fade{position:absolute;inset:0;background:#0d1226;color:#fff;font-family:'Jua';font-size:34px;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .9s;z-index:8}
#fade.on{opacity:1;pointer-events:auto}
.admgrid{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;margin-top:8px}
.admgrid>b{font-family:'Jua';font-weight:400;font-size:15px;white-space:nowrap}
.admgrid>div{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
#basket{position:absolute;right:10px;top:10px;z-index:4;background:rgba(255,250,242,.96);border:2px solid var(--ink);border-radius:12px;padding:6px 10px;font-size:13px;min-width:170px;box-shadow:0 3px 0 var(--ink)}
#buffs{position:absolute;left:10px;top:44px;z-index:3;background:rgba(255,250,242,.94);border:2px solid var(--ink);border-radius:10px;padding:2px 9px;font-size:14px}
#basket b{font-family:'Jua';font-weight:400;font-size:15px}
#basket .tot{margin-top:4px;border-top:1px dashed #c9b99a;padding-top:3px;font-family:'Jua'}
#course{display:none;flex-wrap:wrap;gap:6px;margin-top:12px;background:var(--paper);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:8px 10px;align-items:center}
#course .ct{font-family:'Jua';font-size:17px;width:100%}
#course .ci{background:#fff;border:2px solid var(--ink);border-radius:99px;padding:2px 10px;font-size:14px}
#course .ci.done{background:#d9f5df}
body.role-customer #panel{display:none} body.role-customer #course{display:flex}
/* 내 캐릭터 */
.ptag{position:absolute;left:0;top:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:3px;will-change:transform}
.ptag .me{font-family:'Jua';font-size:13px;background:#d9483b;color:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 8px;white-space:nowrap}
.ptag .hint{font-size:13px;background:rgba(36,50,58,.9);color:#fff;border-radius:8px;padding:2px 8px;white-space:nowrap;order:-1}
.ptag .hint b{display:inline-block;background:#ffe48a;color:var(--ink);border-radius:4px;padding:0 5px;font-family:'Jua';font-weight:400}
#joy{position:absolute;left:16px;bottom:16px;width:136px;height:136px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,.25));border:3px solid rgba(36,50,58,.65);z-index:4;touch-action:none;display:none;-webkit-user-select:none}
#joy::before{content:"▲";position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:12px;color:rgba(36,50,58,.6)}
#joy::after{content:"이동 · 끝까지 밀면 달리기";position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font-family:'Jua';font-size:11px;white-space:nowrap;color:var(--ink);background:rgba(255,250,242,.85);border-radius:99px;padding:0 6px}
#joy i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,250,242,.97);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);transition:transform .05s}
#joy.on{border-color:var(--gold)}
.actbtns{position:absolute;right:14px;bottom:64px;display:none;flex-direction:column;align-items:center;gap:8px;z-index:4}
.actbtns button{width:66px;height:66px;border-radius:50%;border:3px solid var(--ink);background:#ffe48a;font-family:'Jua';font-size:15px;line-height:1.05;box-shadow:0 3px 0 var(--ink);touch-action:manipulation;padding:0}
.actbtns button.sm{width:52px;height:52px;font-size:13px;background:#fff}
.actbtns button:active{transform:translateY(2px);box-shadow:none}
body.touch #joy{display:block} body.touch .actbtns{display:flex} body.touch .keyhelp{display:none}
body.touch .camctl{right:auto;left:50%;transform:translateX(-50%);bottom:10px}
.keyhelp{position:absolute;left:10px;bottom:10px;z-index:3;background:rgba(255,250,242,.9);border:2px solid var(--ink);border-radius:10px;padding:3px 9px;font-size:12px}

/* 3D 위 라벨 */
.plate3d{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:1px 9px;font-family:'Jua';font-size:15px;white-space:nowrap;box-shadow:0 2px 0 var(--ink);will-change:transform}
.plate3d small{font-size:12px;opacity:.7;margin-left:4px}
.plate3d.can{background:#ffe48a;animation:pulse .7s ease-in-out infinite}
@keyframes pulse{50%{background:#fff3c4}}
.tag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;will-change:transform}
.tag>*{display:none}
.tag[data-m=q] .wish,.tag[data-m=q] .pat{display:block}
.tag[data-m=s] .ring{display:grid}
.tag[data-m=r] .react{display:block}
.tag .wish{font-size:18px;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 6px;line-height:1.35}
.tag.sel .wish{background:#ffe48a;outline:3px solid var(--gold)}
.tag .pat{width:36px;height:6px;border:1.5px solid var(--ink);border-radius:99px;background:#eee;overflow:hidden;margin-top:2px}
.tag .pat i{display:block;height:100%;background:#6cc070}
.tag.angry .wish{animation:shake .3s linear infinite}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.tag .ring{width:30px;height:30px;border-radius:50%;place-items:center;border:2px solid var(--ink);font-size:15px;background:#fff}
.tag .react{font-family:'Jua';font-size:15px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:0 6px;white-space:nowrap}

/* 패널 */
#panel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}
.pc{background:var(--paper);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:6px 8px;cursor:pointer;min-width:0}
.pc.can{outline:4px solid var(--gold);outline-offset:2px}
.pc-h{display:flex;justify-content:space-between;align-items:center;font-family:'Jua';font-size:16px;gap:4px}
.pc-h .occ{font-size:13px;background:#e6f3f7;border-radius:99px;padding:0 7px;white-space:nowrap}
.gauge{display:flex;align-items:center;gap:5px;font-size:12px;margin:5px 0 3px}
.gauge .track{position:relative;flex:1;height:9px;border-radius:99px;background:linear-gradient(90deg,#4fb3d9,#e9f2f2 45%,#f08a5d);border:2px solid var(--ink)}
.gauge .band{position:absolute;top:-2px;bottom:-2px;border:2px solid var(--ink);border-radius:4px;background:rgba(255,255,255,.55)}
.gauge .mark{position:absolute;top:-6px;width:4px;height:17px;margin-left:-2px;background:var(--ink);border-radius:2px}
.gauge .tt{font-family:'Jua';font-size:14px;min-width:42px;text-align:right}
.gauge .tt.bad{color:var(--red)}
.row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:4px}
.lbl{font-size:11px}
.cleanbar{flex:1;min-width:30px;height:9px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.cleanbar i{display:block;height:100%;width:100%;background:#6cc070}
.btn{font-size:13px;border:2px solid var(--ink);border-radius:9px;background:#fff;padding:3px 7px;cursor:pointer;box-shadow:0 2px 0 var(--ink);color:var(--ink);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.hot{background:#ffe0d1}.btn.cold{background:#d6f0fb}
.btn.big{font-size:20px;padding:8px 18px;border-width:3px;box-shadow:0 4px 0 var(--ink)}
.btn.primary{background:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.milkline{font-family:'Jua';font-size:15px;margin:6px 0 2px}

.pop{position:absolute;pointer-events:none;font-family:'Jua';font-size:18px;color:#1d7a3a;text-shadow:0 2px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff;animation:rise 1.2s ease-out forwards;z-index:30;white-space:nowrap}
.pop.bad{color:var(--red)}.pop.star{color:#c88a00}
@keyframes rise{to{transform:translateY(-46px);opacity:0}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:8px 16px;border-radius:99px;font-family:'Jua';opacity:0;transition:.25s;z-index:40;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#modal{position:fixed;inset:0;background:rgba(20,35,45,.55);display:grid;place-items:center;z-index:50;padding:14px}
#modal.hidden{display:none}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px 20px}
.card h2{margin:0 0 6px;font-size:28px;font-family:'Jua';font-weight:400}
.card p{line-height:1.55;margin:6px 0}
.card ul{padding-left:18px;line-height:1.6;margin:6px 0}
.actions{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.sumrow{display:flex;justify-content:space-between;border-bottom:1px dashed #c9b99a;padding:5px 0;font-size:15px;gap:8px}
.sumrow b{font-family:'Jua';font-weight:400;font-size:17px;text-align:right}
.sumrow.total b{color:var(--red);font-size:21px}
.shop{display:grid;gap:8px;margin-top:8px}
.item{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 10px}
.item .ico{font-size:28px}.item .tx{flex:1}
.item .tx b{font-family:'Jua';font-weight:400;font-size:16px}
.item .tx div{font-size:12px;opacity:.8}
.lv{font-size:11px;background:#c9e6f0;border-radius:99px;padding:0 6px;margin-left:4px}
.title-art{font-size:64px;text-align:center;line-height:1}
.big-sign{font-family:'Jua';font-size:42px;text-align:center;color:var(--red);margin:4px 0}
@media (max-width:760px){
  #panel{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat{font-size:14px;padding:1px 7px}.sign{font-size:18px}
  #stage{height:58vh}
  .status{max-width:calc(100% - 150px);font-size:12px}
}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="sign" id="signBtn" style="cursor:default">♨ 행복탕</div>
    <div class="stat">📅 <span id="day">1</span>/7일</div>
    <div class="stat">🕐 <span id="clock">06:00</span></div>
    <div class="stat">💰 <span id="money">0</span>원</div>
    <div class="stat">⭐ <span id="rep">3.0</span></div>
    <div class="stat" id="weather" title="오늘 날씨">☀️ 맑음</div>
    <div class="hud-sp"></div>
    <button class="iconbtn" id="adminBtn" title="관리자 패널" style="display:none">🛠️</button>
    <button class="iconbtn" id="soundBtn" title="소리">🔊</button>
    <button class="iconbtn" id="pauseBtn" title="일시정지">⏸</button>
  </header>
  <div id="timebar"><i></i></div>
  <div id="stage">
    <div id="loading">♨ 목욕탕 물 데우는 중…</div>
    <div id="labels"></div>
    <div class="status" id="status">손님 머리 위 말풍선을 누르고 → 시설을 누르세요</div>
    <div class="keyhelp"><b>WASD</b> 이동 · <b>Shift</b> 달리기 · <b>E</b> 안내 · <b>R</b> 청소 · <b>F</b> 온도<br>🖱️ 드래그 회전 · 우클릭(또는 Shift+드래그) 이동 · 휠 확대 · <b>Z/C</b> 회전 · <b>T/G</b> 높이</div>
    <div id="joy"><i></i></div>
    <div class="actbtns"><button id="actE">E<br>안내</button><button class="sm" id="actR">🧹<br>청소</button><button class="sm" id="actF">🌡️<br>온도</button></div>
    <div id="fade"></div>
    <div id="basket" style="display:none"></div>
    <div id="buffs" style="display:none"></div>
    <div class="camctl"><button id="zin" title="확대">＋</button><button id="zout" title="축소">－</button><button id="zreset" title="시점 초기화">⟲</button><button id="joyToggle" title="조이스틱 켜기/끄기">🕹️</button></div>
  </div>
  <div id="panel"></div>
  <div id="course"></div>
  <div id="toast"></div>
</div>
<div id="modal" class="hidden"></div>

<script>
/* ======================= 게임 데이터 ======================= */
const DAYS = 7, DAY_LEN = 100;
const FAC = {
  warm:  {name:'온탕',   icon:'♨️', cap:2, max:5, time:9,  pay:6000,  temp:41, range:[39,42], drift:-0.45, ctrl:'🔥 데우기', ctrlAmt:2.5},
  cold:  {name:'냉탕',   icon:'🧊', cap:2, max:4, time:6,  pay:4000,  temp:18, range:[15,20], drift:0.4,  ctrl:'🧊 얼음',   ctrlAmt:-2.5},
  sauna: {name:'사우나', icon:'🔥', cap:2, max:5, time:11, pay:7000},
  scrub: {name:'때밀이', icon:'🧽', cap:1, max:3, time:13, pay:20000},
};
const WEATHER = {
  sunny:  {name:'맑음', icon:'☀️', spawn:[2.8,3.9], sky:'#9fd8f5', sun:.75, hemi:.75, desc:'손님이 많이 와요 (10초에 3명꼴)'},
  cloudy: {name:'흐림', icon:'☁️', spawn:[5,10],    sky:'#c3ccd3', sun:.38, hemi:.66, desc:'손님이 보통이에요 (10초에 1~2명)'},
  rain:   {name:'비',   icon:'🌧️', spawn:[12,18],   sky:'#8d9aa5', sun:.15, hemi:.55, fx:'rain', desc:'손님이 적게 와요'},
  snow:   {name:'눈',   icon:'❄️', spawn:[12,18],   sky:'#d5dee6', sun:.22, hemi:.66, fx:'snow', desc:'손님이 적게 와요'},
};
function rollWeather(){ return weighted([['sunny',35],['cloudy',30],['rain',20],['snow',15]]); }
const WISH = {warm:'♨️', cold:'🧊', sauna:'🔥', scrub:'🧽', milk:'🍌🥛'};
const WISH_NAME = {warm:'온탕', cold:'냉탕', sauna:'사우나', scrub:'때밀이', milk:'바나나우유'};
const PEOPLE = [
  {name:'김씨 할아버지', skin:'#f2c9a0', hair:'#e8e8e8', style:'bald',  towel:'#ffffff', s:.95, glasses:1},
  {name:'한 할머니',     skin:'#f5cfaa', hair:'#cfcfd6', style:'bun',   towel:'#f6a5c0', s:.9},
  {name:'윤씨 아저씨',   skin:'#e3b088', hair:'#2b2b2b', style:'short', towel:'#5aa9e6', s:1.05, beard:1},
  {name:'박 노인회장',   skin:'#efc29a', hair:'#bdbdbd', style:'short', towel:'#9b7bd1', s:.95, glasses:1},
  {name:'최 학생',       skin:'#f8d5b5', hair:'#3a2a20', style:'short', towel:'#7ed37e', s:.98},
  {name:'오 꼬마',       skin:'#ffd9bd', hair:'#4a3020', style:'short', towel:'#ffd14a', s:.7},
  {name:'이 과장',       skin:'#f0c39d', hair:'#1f1f1f', style:'short', towel:'#ffffff', s:1, glasses:1},
  {name:'조 대리',       skin:'#f7d0ae', hair:'#2a1c14', style:'long',  towel:'#ff8fa3', s:.97},
  {name:'정 사장',       skin:'#e6b48c', hair:'#333333', style:'bald',  towel:'#ffb347', s:1.08, beard:1},
  {name:'서 언니',       skin:'#f9d6b8', hair:'#7a3b22', style:'yang',  towel:'#ffc0d6', s:.97},
  {name:'장씨 삼촌',     skin:'#d9a57c', hair:'#222222', style:'yang',  towel:'#bfe3ff', s:1.02},
  {name:'강 선생',       skin:'#f3caa4', hair:'#5a4030', style:'long',  towel:'#c3a6f0', s:.98, glasses:1},
  {name:'동네 꼬맹이',   skin:'#ffdcc2', hair:'#2d1d12', style:'yang',  towel:'#ffe08a', s:.68},
  {name:'공사장 반장',   skin:'#c98f63', hair:'#1a1a1a', style:'short', towel:'#ff7a45', s:1.1, beard:1},
];
const UPG = [
  {id:'warmCap',  ico:'♨️', name:'온탕 넓히기',     desc:'온탕 자리 +1',                       cost:l=>25000+l*20000, max:3},
  {id:'coldCap',  ico:'🧊', name:'냉탕 넓히기',     desc:'냉탕 자리 +1',                       cost:l=>18000+l*15000, max:2},
  {id:'saunaCap', ico:'🔥', name:'사우나 증축',     desc:'사우나 자리 +1',                     cost:l=>28000+l*22000, max:3},
  {id:'scrubber', ico:'🧽', name:'세신사 추가 고용', desc:'세신 침대 +1 · 일당 1만 원',          cost:l=>60000+l*40000, max:2},
  {id:'boiler',   ico:'🛢️', name:'자동 보일러',     desc:'온탕 온도를 알아서 맞춰요',            cost:()=>45000, max:1},
  {id:'chiller',  ico:'❄️', name:'냉각기',          desc:'냉탕 온도를 알아서 맞춰요',            cost:()=>35000, max:1},

function beep(f=600, d=.09, type='sine', v=.05){
  if(!sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = v;

    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  }catch(e){}
}

function windowTex(base, win, cols, rows, lit='#ffe9a8'){
  return canvasTex(256,256,(g,w,h)=>{
    g.fillStyle = base; g.fillRect(0,0,w,h);
    const cw = w/cols, ch = h/rows;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      g.fillStyle = Math.random()<.25 ? lit : win;
      g.fillRect(c*cw+cw*.2, r*ch+ch*.22, cw*.6, ch*.5);
      g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(c*cw+cw*.15, r*ch+ch*.72, cw*.7, ch*.06);
    }
  });
}
function building(x, z, w, d, h, base, opt={}){
  const tex = windowTex(base, opt.win||'#9cc6d8', opt.cols||Math.max(2,Math.round(w/1.4)), opt.rows||Math.max(1,Math.round(h/1.6)));
  const side = M(base);
  const mats = [side, side, M(opt.roof||'#8a8f94'), side, sMat(tex), sMat(tex)];
  const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mats);
  b.position.set(x, h/2, z); b.castShadow = b.receiveShadow = true; scene.add(b);
  box(w+.2, .25, d+.2, M(opt.trim||'#6d7378'), x, h+.12, z);
  if(opt.sign){
    plane(Math.min(w-.4, 3.2), .7, sMat(textTex(opt.sign,{bg:opt.signBg||'#fffaf2',fg:opt.signFg||'#24323a',border:opt.signFg||'#24323a',font:58})), x, Math.min(h-.5, 2.9), z+d/2+.02);
  }
  if(opt.awning){
    const a = box(w-.3, .08, 1.0, M(opt.awning), x, 2.2, z+d/2+.5); a.rotation.x = .25;
    for(let i=0;i<Math.floor((w-.3)/.5);i+=2) box(.5,.085,1.01,M('#ffffff'),x-(w-.3)/2+.25+i*.5,2.205,z+d/2+.5).rotation.x=.25;

  return b;
}

const SKY_TEX = [];
function skyTex(i){
  if(SKY_TEX[i]) return SKY_TEX[i];
  const glass = ['#5d7f99','#6f8fa6','#7d97a8','#4f6b82','#8aa3b3','#a9b9c2'][i%6], cols = 6 + (i%3)*2, rows = 22;

  const draw = night => (g,w,h) => {
    g.fillStyle = night ? '#000' : glass; g.fillRect(0,0,w,h);
    const cw = w/cols, ch = h/rows;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      g.fillStyle = night ? (lit[r*cols+c] ? pick(['#ffe2a0','#fff3cf','#cfe8ff']) : '#000') : (lit[r*cols+c] ? '#b9d3e2' : '#8fb0c6');

    }
    if(!night){ g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(0,0,w*.18,h); }
  };
  return SKY_TEX[i] = {map:canvasTex(128,256,draw(false)), emis:canvasTex(128,256,draw(true))};
}

function updateSeoul(dt){

function adminAction(a){
  const inDay = S.phase==='day' || S.phase==='closing';
  if(a.startsWith('m')){ S.money = a==='m0' ? 0 : S.money + ({m10:1e4, m100:1e5, m1000:1e6})[a]; }
  if(a==='r5') S.rep = 5; if(a==='r1') S.rep = 1.5;
  if(a.startsWith('w_')){ S.weather = a.slice(2); }
  if(a.startsWith('s_') && S.phase==='day'){ const n = a==='s_five' ? 5 : 1; for(let i=0;i<n;i++) spawn(a==='s_five' ? null : a.slice(2)); }
  if(a==='maxup'){ UPG.forEach(u => { while(S.upg[u.id] < u.max){ S.upg[u.id]++; const capMap = {warmCap:'warm', coldCap:'cold', saunaCap:'sauna', scrubber:'scrub'}; if(capMap[u.id]){ const f = S.fac[capMap[u.id]]; f.cap++; while(f.slots.length < f.cap) f.slots.push(null); } if(u.id==='fridge') S.milk.max += 6; } }); refreshBeds(); }
  if(a==='clean') for(const k in FAC) S.fac[k].clean = 100;
  if(a==='milk'){ S.milk.stock = Math.max(S.milk.stock, 18); S.eggs = Math.max(S.eggs, 30); }
  if(a.startsWith('sp')) ADMIN.speed = +a.slice(2);
  if(a==='close' && S.phase==='day') S.time = DAY_LEN;
  if(a==='night' && inDay){ S.queue.slice().forEach(c => { removeFromQueue(c); leaveWalk(c, '내일 올게요 👋'); }); for(const k in FAC) S.fac[k].slots = S.fac[k].slots.map(()=>null); PLAYER.using = null; S.people.forEach(c => { if(c.loc==='svc'){ c.atK = null; leaveWalk(c,'👋'); } }); S.buff = {}; if(!S.ds) S.ds = {visitors:0, served:0, services:0, angry:0, revenue:0, cost:0, milk:0, moodSum:0, startMoney:S.money}; S.phase = 'night'; }
  if(a==='d_minus') S.day = Math.max(1, S.day-1);
  if(a==='d_plus') S.day = Math.min(DAYS, S.day+1);
  if(a==='pat') ADMIN.noPatience = !ADMIN.noPatience;
  if(a==='lock'){ ADMIN.on = false; try{ localStorage.removeItem('hbt_admin'); }catch(e){} $('#adminBtn').style.display = 'none'; S.paused = false; hideModal(); toast('🔒 관리자 모드를 껐어요'); return; }
  sfx.click(); updateHUD(); openAdmin();
}

function prodShape(kind, g, x, y, z, col){
  const c = M(col), white = M('#ffffff');
  if(kind==='towel'){ for(let i=0;i<3;i++) box(.32,.06,.24, i%2 ? white : c, x, y+.03+i*.062, z, g); }
  else if(kind==='basin'){ cyl(.16,.11,.12,c,x,y+.06,z,g,14); cyl(.13,.13,.012,M('#fff6d6'),x,y+.12,z,g,14); cyl(.04,.04,.1,c,x+.15,y+.15,z,g,8); }
  else if(kind==='roll'){ [.07,.21].forEach(dy => { const r = cyl(.07,.07,.32,c,x,y+dy,z,g,12); r.rotation.z = Math.PI/2; }); }
  else if(kind==='aroma'){ cyl(.06,.07,.15,c,x,y+.075,z,g,10); [-1,0,1].forEach(i => { const st = cyl(.007,.007,.24,M('#8b5a2b'),x+i*.025,y+.25,z,g,4); st.rotation.z = i*.25; }); }
  else if(kind==='chime'){ cyl(.08,.08,.03,c,x,y+.36,z,g,12); [-1,0,1].forEach(i => cyl(.012,.012,.18,M('#d9dee0'),x+i*.04,y+.24,z,g,5)); box(.07,.1,.005,white,x,y+.08,z,g); }
  else if(kind==='duck'){ sph(.09,c,x,y+.09,z,g,12); sph(.06,c,x+.05,y+.2,z,g,10); box(.06,.02,.05,M('#f2994a'),x+.11,y+.2,z,g); sph(.012,M('#1d1d1d'),x+.07,y+.23,z+.05,g,6); }
  else if(kind==='slipper'){ [-.07,.07].forEach(o => { box(.1,.035,.26,c,x+o,y+.018,z,g); box(.1,.05,.07,white,x+o,y+.055,z-.04,g); }); }
  else if(kind==='bottle'){ cyl(.055,.06,.2,c,x,y+.1,z,g,10); cyl(.022,.022,.06,white,x,y+.23,z,g,8); box(.06,.07,.005,white,x,y+.1,z+.06,g); }

  else box(.24,.26,.3,c,x,y+.13,z,g);
}

function updatePets(dt){
  const P = PLAYER, room = P.inHome ? 'home' : P.inStore ? 'store' : P.inPrem ? 'prem' : null;
  for(const t in PET.models){ const pp = PET.models[t]; pp.g.visible = S.pet===t && !(t!=='hamster' && DRIVE.active); pp.bow.visible = !!S.petBow; }
  const pp = PET.models[S.pet];
  if(pp && S.pet==='hamster') animPet(pp, false, dt);
  if(pp && S.pet!=='hamster' && !DRIVE.active){
    const tx = (S.phase==='sleeping' && P.sleepPos) ? P.sleepPos.x - 1.2 : P.x - Math.sin(P.ry)*.9 + Math.cos(P.ry)*.35;
    const tz = (S.phase==='sleeping' && P.sleepPos) ? P.sleepPos.z + 1.2 : P.z - Math.cos(P.ry)*.9 - Math.sin(P.ry)*.35;
    if(PET.room !== room || Math.hypot(tx-PET.x, tz-PET.z) > 7){ PET.x = tx; PET.z = tz; PET.room = room; } // 순간이동하면 같이 와요
    const dx = tx-PET.x, dz = tz-PET.z, d = Math.hypot(dx, dz), moving = d > .35;
    if(moving){
      const sp = Math.min(d*3.2, 9)*dt; PET.x += dx/d*sp; PET.z += dz/d*sp;
      const q = {x:PET.x, z:PET.z}; collide(q, .2, null, room); PET.x = q.x; PET.z = q.z;
      let df = Math.atan2(dx, dz) - PET.ry; df = Math.atan2(Math.sin(df), Math.cos(df)); PET.ry += df*Math.min(1, dt*10);
    } else { let df = P.ry - PET.ry; df = Math.atan2(Math.sin(df), Math.cos(df)); PET.ry += df*Math.min(1, dt*2); }
    pp.g.position.set(PET.x, 0, PET.z); pp.g.rotation.y = PET.ry;
    animPet(pp, moving, dt);
  }
  // 가게 고양이, 어항, 펫샵 안 동물들
  if(W.shopCat){ const on = !!S.shopCat; W.shopCat.cat.g.visible = W.shopCat.z.visible = on; if(on){ W.shopCat.cat.g.scale.y = 1 + Math.sin(T*2)*.03; W.shopCat.cat.tail.rotation.z = Math.sin(T*1.5)*.4; W.shopCat.z.position.y = 1.6 + (T*.3 % 1)*.25; W.shopCat.z.material.opacity = .85 - (T*.3 % 1)*.6; } }
  if(W.fishTank){ W.fishTank.g.visible = !!S.fishTank; if(S.fishTank) W.fishTank.fish.forEach(o => { o.f.position.x = Math.sin(T*o.sp + o.ph)*.5; o.f.rotation.y = Math.cos(T*o.sp + o.ph) > 0 ? 0 : Math.PI; }); }
  if(P.inStore && P.shop==='pet'){
    (W.penPups||[]).forEach(o => { if(o.still){ animPet(o.pp, false, dt, o.ph); return; } const a = T*.8 + o.ph; o.pp.g.position.x = o.x + Math.sin(a)*.18; o.pp.g.position.z = o.z + Math.sin(a*1.3)*.1; o.pp.g.rotation.y = Math.cos(a) > 0 ? Math.PI/2 : -Math.PI/2; animPet(o.pp, Math.abs(Math.cos(a)) > .3, dt, o.ph); });
    (W.petFish||[]).forEach(o => { o.f.position.z = o.z0 + Math.sin(T*o.sp + o.ph)*.55; o.f.rotation.x = Math.cos(T*o.sp + o.ph) > 0 ? Math.PI/2 : -Math.PI/2; });
  }
  (W.petDisplay||[]).forEach(o => animPet(o.pp, false, dt, o.ph));
}

function trfDrawCount(n){
  const c = TRAFFIC.cdCanvas.getContext('2d');

  TRAFFIC.cdTex.needsUpdate = true;
}

function trfActivate(V, lane, p){
  const L = TRAFFIC.lanes[lane];
  V.lane = lane; V.dir = L.dir; V.laneZ = L.z; V.sgn = L.sgn; V.p = p; V.off = 0; V.swerve = false;
  V.dwell = 0; V.served = false; V.waitT = 0; V.active = true; V.g.visible = true;
  if(V.kind === 'sedan'){ const c = M(pick(TRF_COLORS)); V.body.forEach(m => m.material = c); }
  if(V.kind === 'sedan' || V.kind === 'taxi') V.vmax = rnd(5.5, 8.5);
  else if(V.kind === 'truck') V.vmax = rnd(5, 7);
  V.v = V.vmax * .8;
  V.ry = V.dir > 0 ? 0 : Math.PI;
  V.g.position.set(V.dir*p, 0, V.laneZ); V.g.rotation.y = V.ry;
}

function trfOutdoor(){ return typeof PLAYER !== 'undefined' && !PLAYER.inHome && !PLAYER.inStore && !PLAYER.inPrem && !PLAYER.inDollar; }

function trfTrySpawn(lane){
  const T_ = TRAFFIC, L = T_.lanes[lane], entry = -T_.EDGE;
  const hidden = T_.vehicles.filter(v => !v.active && v.kind !== 'bus');
  if(!hidden.length) return false;
  const r = Math.random(), want = r < .18 ? 'taxi' : r < .32 ? 'truck' : 'sedan';
  const V = hidden.find(v => v.kind === want) || pick(hidden);
  if(!trfEntryClear(L, V.len)) return false;
  trfActivate(V, lane, entry);
  return true;
}
function trfEntryClear(L, len){
  const T_ = TRAFFIC, entry = -T_.EDGE;
  for(const B of T_.vehicles){
    if(!B.active || B.dir !== L.dir) continue;
    if(B.p - B.len/2 < entry + len/2 + 3) return false;
  }
  if(Math.abs(DRIVE.z - L.z) < 2 && Math.abs(L.dir*DRIVE.x - entry) < 6) return false;
  if(trfOutdoor() && !DRIVE.active && Math.abs(PLAYER.z - L.z) < 2 && Math.abs(L.dir*PLAYER.x - entry) < 5) return false;
  return true;
}

function updateTraffic(dt){
  const T_ = TRAFFIC; if(!T_.bus || dt <= 0) return;
  T_.t += dt;
  const night = W.night || 0;
  // ---- 신호 주기 ----
  const c = T_.t % T_.CYCLE;
  const light = c < 12 ? 'green' : c < 14 ? 'yellow' : 'red';
  if(light !== T_.light){
    T_.light = light;
    const idx = light === 'red' ? 0 : light === 'yellow' ? 1 : 2;
    T_.carLamps.forEach(ls => ls.forEach((l, i) => l.material = i === idx ? T_.lampOn[i] : T_.lampOff[i]));
    if(light === 'red' && trfOutdoor() && Math.abs(PLAYER.x) < 9 && PLAYER.z > 6 && T_.chimeT <= 0){ beep(1180, .07, 'sine', .02); setTimeout(() => beep(1180, .07, 'sine', .02), 160); T_.chimeT = 5; }
  }
  T_.chimeT -= dt;
  const pedGreen = light === 'red', remain = Math.ceil(T_.CYCLE - c);
  const flashOn = !pedGreen || remain > 3 || Math.floor(T_.t*4) % 2 === 0;
  const pf = (pedGreen ? 1 : 0) + (flashOn ? 2 : 0);
  if(pf !== T_.pedFlash){
    T_.pedFlash = pf;
    T_.pedHeads.forEach(h => { h.red.material = pedGreen ? T_.pedMat.redOff : T_.pedMat.redOn; h.grn.material = pedGreen && flashOn ? T_.pedMat.greenOn : T_.pedMat.greenOff; });
  }
  const cdN = pedGreen ? remain : 0;
  if(cdN !== T_.cd){ T_.cd = cdN; trfDrawCount(cdN); }
  // ---- 밤 불빛 ----
  T_.headMat.emissiveIntensity = .15 + night*1.2;
  T_.glowMat.opacity = night*.5; T_.glowMat.visible = night > .05;
  if(T_.shelterLight) T_.shelterLight.emissiveIntensity = .1 + night*1.1;
  if(T_.bus.winMat) T_.bus.winMat.emissiveIntensity = night*.7;
  T_.vehicles.forEach(v => { if(v.taxiMat) v.taxiMat.emissiveIntensity = .1 + night*.8; });
  // ---- 날씨·밤에 따라 차 수 / 속도 ----
  const wx = S.weather === 'snow' ? .62 : S.weather === 'rain' ? .8 : 1;
  const target = Math.round(7 - night*3.5 - (wx < 1 ? 1 : 0));
  // 내 차가 멈춰 있는 시간 (멈춘 차는 옆 차선으로 비켜 지나감)
  T_.pcStill = (!DRIVE.active || Math.abs(DRIVE.speed) < .4) ? T_.pcStill + dt : 0;
  // ---- 새 차 등장 ----
  const nCars = T_.vehicles.filter(v => v.active && v.kind !== 'bus').length;
  for(let ln=0; ln<2; ln++){
    T_.spawnT[ln] -= dt;
    if(T_.spawnT[ln] <= 0){
      T_.spawnT[ln] = rnd(1.2, 3.5) * (1 + night*1.5);
      if(nCars < target) trfTrySpawn(ln);
    }
  }
  const B = T_.bus;
  if(!B.active){ B.wait -= dt; if(B.wait <= 0 && trfEntryClear(T_.lanes[0], B.len)) trfActivate(B, 0, -T_.EDGE - 2); }
  // ---- 차 움직이기 ----
  const out = trfOutdoor(), walker = out && !DRIVE.active && PLAYER.z > 9.8 && PLAYER.z < 17.4;
  for(const A of T_.vehicles){
    if(!A.active) continue;
    const fA = A.p + A.len/2, bA = A.p - A.len/2, zA = A.g.position.z;
    let dmin = 1e9, pcLim = null, waitingWalker = false;
    // 다른 차들
    for(const O of T_.vehicles){
      if(O === A || !O.active) continue;
      const zO = O.g.position.z;
      if(Math.abs(zO - zA) > (A.wid + O.wid)/2 + .35) continue;
      if(O.dir === A.dir){
        if(O.p <= A.p) continue;
        dmin = Math.min(dmin, O.p - O.len/2 - (1.4 + A.v*.5) - fA);
      } else {
        if(A.off > .3) continue; // 추월 중인 차는 마주 오는 차가 기다려 줌
        const pO = A.dir * O.g.position.x;
        if(pO + O.len/2 <= bA) continue;
        dmin = Math.min(dmin, pO - O.len/2 - 2.5 - fA);
      }
    }
    // 내 차 (주차 중이어도 절대 통과하지 않음)
    if(Math.abs(DRIVE.z - zA) < A.wid/2 + 1.0){
      const pD = A.dir * DRIVE.x;
      if(pD + 1.2 > bA){ pcLim = pD - 1.2 - (1.0 + A.v*.4) - fA; dmin = Math.min(dmin, pcLim); }
    }
    // 걸어 다니는 나
    if(walker && Math.abs(PLAYER.z - zA) < A.wid/2 + .7){
      const pW = A.dir * PLAYER.x;
      if(pW + .4 > bA){ const d = pW - .4 - 1.2 - fA; if(d < 8){ dmin = Math.min(dmin, d); waitingWalker = d < 1; } }
    }
    // 신호
    if(fA < T_.STOP_P + .3 && light !== 'green'){
      const d = T_.STOP_P - fA;
      const canStop = light === 'yellow' ? A.v*A.v <= 2*7*Math.max(d, 0) + .3 : A.v*A.v <= 2*10*Math.max(d, 0) + 1;
      if(canStop) dmin = Math.min(dmin, d);
    }
    // 마을버스 정류장
    if(A.kind === 'bus' && !A.served && A.lane === 0){
      const lim = -T_.BUS_X + A.len/2;
      if(fA < lim + .3){
        dmin = Math.min(dmin, lim - fA);
        if(Math.abs(lim - fA) < .3 && A.v < .2 && A.off < .1){
          A.dwell = 6; A.served = true;
          if(out && Math.hypot(PLAYER.x - T_.BUS_X, PLAYER.z - 9.2) < 10) toast('🚌 행복 01번 마을버스가 "행복탕 앞" 정류장에 도착했어요');
        }
      }
    }
    // 멈춘 내 차는 마주 오는 차선이 비었을 때 옆으로 비켜 지나감
    if(!A.swerve && A.off < .1 && pcLim !== null && pcLim <= dmin + .01 && pcLim < 10 && T_.pcStill > 1.5){
      let clear = true;
      for(const O of T_.vehicles) if(O.active && O.dir !== A.dir && Math.abs(O.g.position.x - DRIVE.x) < 32){ clear = false; break; }
      if(clear) A.swerve = true;
    }
    if(A.swerve && (bA > A.dir*DRIVE.x + 1.8 || (DRIVE.active && Math.abs(DRIVE.speed) > 1))) A.swerve = false;
    // 속도
    let moved = 0;
    if(A.dwell > 0){
      A.dwell -= dt; A.v = 0;
    } else {
      const vt = Math.min(A.vmax*wx, dmin <= .05 ? 0 : Math.sqrt(2*6*dmin));
      if(A.v < vt) A.v = Math.min(vt, A.v + A.acc*dt); else A.v = Math.max(vt, A.v - 14*dt);
      moved = A.v*dt; A.p += moved;
    }
    const braking = A.v < .3 || dmin < A.v*A.v/(2*6) + .5;
    A.tail.emissiveIntensity = .25 + night*.6 + (braking ? .9 : 0);
    // 문 (정류장에서 열림)
    if(A.door){
      const open = A.dwell > .7 ? 1 : 0, cur = A.doorOpen || 0;
      A.doorOpen = cur + clamp(open - cur, -dt*2.5, dt*2.5);
      A.door.position.x = A.doorX - A.doorOpen*.85; A.door.position.z = 1.02 + A.doorOpen*.08;
    }
    // 경적 (나를 오래 기다릴 때, 아주 가끔)
    A.waitT = waitingWalker ? A.waitT + dt : 0; A.honkT -= dt;
    if(A.waitT > 3 && A.honkT <= 0){ A.honkT = 6; beep(A.kind === 'bus' ? 330 : 470, .14, 'square', .02); }
    // 바퀴
    A.wheels.forEach(w => w.rotation.z -= moved / (w.position.y || .23));
    // 옆 차선으로 비키기
    const prevOff = A.off, step = (.8 + A.v*.4)*dt, tgt = A.swerve ? 3.1 : 0;
    A.off += clamp(tgt - A.off, -step, step);
    const latV = (A.off - prevOff) / dt;
    A.g.position.set(A.dir*A.p, 0, A.laneZ + A.sgn*A.off);
    if(A.v > .15 || Math.abs(latV) > .01) A.ry = Math.atan2(-A.sgn*latV, A.dir*Math.max(A.v, .6));
    A.g.rotation.y = A.ry;
    // 끝까지 가면 사라졌다가 반대편에서 새로 나타남
    if(A.p - A.len/2 > T_.EDGE){
      A.active = false; A.g.visible = false;
      if(A.kind === 'bus') A.wait = rnd(3, 8);
    }
  }
  // ---- 나와 차가 겹치지 않게 밀어내기 ----
  if(!out) return;
  T_.bumpT -= dt;
  for(const A of T_.vehicles){
    if(!A.active) continue;
    const hx = A.len/2, hz = A.wid/2, ax = A.g.position.x, az = A.g.position.z;
    if(DRIVE.active){
      const r = .95, dx = DRIVE.x - ax, dz = DRIVE.z - az, ox = hx + r - Math.abs(dx), oz = hz + r - Math.abs(dz);
      if(ox > 0 && oz > 0){
        if(ox < oz) DRIVE.x += Math.sign(dx || 1)*ox; else DRIVE.z += Math.sign(dz || 1)*oz;
        if(Math.abs(DRIVE.speed) > 6 && T_.bumpT <= 0){ beep(120, .2, 'sawtooth', .03); toast('쾅! 💥 앞차를 조심하세요'); T_.bumpT = 1.5; }
        DRIVE.speed *= -.3;
        if(DRIVE.car) DRIVE.car.position.set(DRIVE.x, 0, DRIVE.z);
        PLAYER.x = DRIVE.x; PLAYER.z = DRIVE.z;
      }
    } else {
      const r = .32, dx = PLAYER.x - ax, dz = PLAYER.z - az, ox = hx + r - Math.abs(dx), oz = hz + r - Math.abs(dz);
      if(ox > 0 && oz > 0){ if(ox < oz) PLAYER.x += Math.sign(dx || 1)*ox; else PLAYER.z += Math.sign(dz || 1)*oz; }
    }
  }
}

function route(from, fromK, to, toK){
  const P = [];
  if(fromK) P.push(...entryPts(fromK, from).reverse());
  const start = P.length ? P[P.length-1] : from;
  const inPts = toK ? entryPts(toK, to) : [];
  const goal = inPts.length ? inPts[0] : to;
  const rs = roomOf(start.z), rg = roomOf(goal.z);
  P.push({x:start.x, z:aisleOf(rs)});
  if(rs!==rg){ P.push({x:0, z:aisleOf(rs)}); P.push({x:0, z:aisleOf(rg)}); }
  P.push({x:goal.x, z:aisleOf(rg)});
  P.push(...inPts, {x:to.x, z:to.z});
  return P;
}

      p.armL.rotation.set(0,0,-2.5 + Math.sin(p.walkT)*.25); p.armR.rotation.set(0,0,2.5 - Math.sin(p.walkT)*.25);
    } else if(c.loc==='leave' && p.expr==='angry'){ // 쿵쾅쿵쾅
      p.armL.rotation.x *= 1.7; p.armR.rotation.x *= 1.7; p.legL.rotation.x *= 1.3; p.legR.rotation.x *= 1.3;
    }
    if(!c.path.length && c.loc==='leave' && c.stage==='exit'){ c.gone = true; }
  } else {
    const a = c.anchor;
    if(c.loc==='leave' && c.stage==='dress'){
      if(c.dressT===0) p.g.rotation.y = -Math.PI/2;
      doDress(c, dt);
    } else if(a){
      const ry = a.rotY || 0;
      let diff = ry - p.g.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      p.g.rotation.y += diff * Math.min(1, dt*10);
      if(a.y!==undefined) p.seatY = a.y; else p.seatY = .51;
      setPose(p, a.pose||'stand', dt);
    } else setPose(p, 'stand', dt);
  }
}

const tmpV = new (window.THREE ? THREE.Vector3 : Object)();
function project(v){
  tmpV.copy(v).project(camera);
  return {x:(tmpV.x*.5+.5)*stageW, y:(-tmpV.y*.5+.5)*stageH, ok:tmpV.z < 1};
}
function placeEl(el, v){
  const q = project(v);
  if(!q.ok){ el.style.visibility = 'hidden'; return; }
  el.style.visibility = '';
  el.style.transform = `translate(${q.x}px,${q.y}px) translate(-50%,-100%)`;
}

/* ======================= 손님 ======================= */
function spawn(forceType){
  if(S.queue.length >= SEATS.length) return;
  const sp = pick(PEOPLE);
  const pool = [['warm',34],['sauna',24],['scrub',24],['cold',18]];
  const w1 = weighted(pool), wishes = [w1];
  if(Math.random() < .35 + S.day*.04){
    const w2 = w1==='warm' && Math.random()<.6 ? 'scrub' : w1==='sauna' && Math.random()<.6 ? 'cold' : weighted(pool.filter(p=>p[0]!==w1));
    wishes.push(w2);
  }
  const r = Math.random(), type = forceType || (r < .10 ? 'vip' : r < .23 ? 'jinsang' : 'normal');
  let spec = sp, name = sp.name;
  if(type==='vip'){ spec = Object.assign({}, sp, {towel:'#f2c94c', shades:1, chain:1}); name = 'VIP ' + sp.name; if(wishes.length<2) wishes.push(w1==='scrub'?'warm':'scrub'); }
  if(type==='jinsang'){ spec = Object.assign({}, sp, {towel:'#6b2b2b'}); name = '진상 ' + sp.name; }
  const p = makePerson(spec);
  p.g.position.set(EXIT.x + rnd(-.4,.4), 0, EXIT.z); p.g.rotation.y = Math.PI;
  const c = {id:S.nextId++, name, type, p, wishes, idx:0, mood:100, patience:0, maxP:0,
             loc:'queue', seatIdx:-1, path:[], anchor:null, atK:null, tag:null, yellT:rnd(4,7), yelling:false};
  if(type==='vip'){ const aura = new THREE.Mesh(new THREE.TorusGeometry(.5,.04,6,28), new THREE.MeshBasicMaterial({color:'#ffd34d'})); aura.rotation.x = Math.PI/2; aura.position.y = .05; p.g.add(aura); c.aura = aura; }
  tagPick(p.g, {cid:c.id});
  resetPatience(c);
  makeTag(c);
  S.queue.push(c); S.people.push(c);
  S.ds.visitors++;
  beep(760,.06,'triangle',.03);
}
function makeTag(c){
  const t = document.createElement('div'); t.className = 'tag'; t.dataset.m = 'q';
  t.innerHTML = '<div class="wish"></div><div class="pat"><i></i></div><div class="ring"></div><div class="react"></div>';

const TYPE_ICON = {vip:'👑', jinsang:'👿', normal:''};
function wishText(c){ return (c.yelling ? '💢 진정!' : TYPE_ICON[c.type] + WISH[c.wishes[c.idx]]); }
function weighted(arr){ let t=arr.reduce((a,b)=>a+b[1],0), r=Math.random()*t; for(const [k,w] of arr){ if((r-=w)<=0) return k; } return arr[0][0]; }
function resetPatience(c){
  const wish = c.wishes[c.idx];
  c.maxP = wish==='milk' ? 10 : Math.max(14, 26 - S.day*1.2 + rnd(-2,3));

}

function removeFromQueue(c){

function clickFacility(k){

  if(k==='dshop') return toast('🛍️ 천원샵 문 앞에서 E를 눌러 들어가서 직접 골라요');

  if(k==='park') return toast('🅿️ 행복아파트 주차장이에요. 차를 몰고 와서 빈 칸에 세워 봐요');
  if(S.role==='customer' && k!=='home') return toast('가까이 가서 E를 눌러 이용해요');
  if(k==='prem') return toast('🏙️ 프리미엄 타워 문 앞(레드카펫)에서 E를 눌러요');

/* ======================= 시설 ======================= */
function mop(k){
  if(S.phase!=='day' && S.phase!=='closing') return;
  const f = S.fac[k]; f.clean = Math.min(100, f.clean + 34);
  beep(400+Math.random()*200,.06,'triangle',.04);

function adjustTemp(k){
  if(S.phase!=='day' && S.phase!=='closing') return;
  const f = S.fac[k]; f.temp = clamp(f.temp + FAC[k].ctrlAmt, 5, 50);
  beep(FAC[k].ctrlAmt>0 ? 300 : 900, .07, 'sine', .04);
}
function tempOff(k){
  const d = FAC[k]; if(!d.range) return 0;
  const t = S.fac[k].temp;
  return t < d.range[0] ? t - d.range[0] : t > d.range[1] ? t - d.range[1] : 0;
}
function finishService(k, i){
  const f = S.fac[k], c = f.slots[i].c;
  f.slots[i] = null;
  f.clean = Math.max(0, f.clean - (k==='scrub'?12:8) * (S.buff.basin ? .5 : 1));
  let pay = FAC[k].pay;
  if(c.type==='vip') pay *= 3;
  if(k==='scrub' && S.buff.scrubTowel) pay += 3000; // 천원샵 때수건
  if(c.type==='jinsang' && Math.random() < .3){ pay = Math.round(pay/2); setTimeout(() => pop(F[k].plate, '👿 반값으로 해줘!', true), 200); }
  earn(pay, F[k].plate);
  if(k==='sauna' && S.eggs > 0){ S.eggs--; setTimeout(() => earn(1500, F.sauna.plate), 300); S.ds.eggs = (S.ds.eggs||0) + 1; }
  S.ds.services++;
  c.idx++; c.atK = k;
  if(c.idx >= c.wishes.length && Math.random() < .45) c.wishes.push('milk');
  if(c.idx < c.wishes.length){
    if(S.phase==='closing' && c.wishes[c.idx]!=='milk'){ depart(c); return; }
    toQueue(c);
  } else depart(c);
}
function earn(n, el){

  sfx.coin(); pop(el, `+${won(n)}원`); updateHUD();
}
function leaveWalk(c, text){
  c.loc = 'leave'; c.stage = 'dress'; c.dressT = 0;
  c.tReact.textContent = text; c.tag.dataset.m = 'r';
  const i = lockerUse.indexOf(Math.min(...lockerUse)); lockerUse[i]++; c.locker = i;
  sendTo(c, {x:-8.85, z:LOCKER_Z[i], pose:'stand', rotY:-Math.PI/2}, null);
}
function depart(c, extra){
  if(S.buff.towel) c.mood = Math.min(100, c.mood + 10); // 천원샵 뽀송 수건
  if(S.fishTank) c.mood = Math.min(100, c.mood + 5); // 펫샵 대기실 어항
  const stars = clamp(1 + c.mood/25, 1, 5);
  const wgt = c.type==='vip' ? .22 : .12;
  S.rep = S.rep*(1-wgt) + stars*wgt;
  if(c.type==='vip') S.ds.vip = (S.ds.vip||0)+1;
  S.ds.served++; S.total.served++; S.ds.moodSum += c.mood;
  let text = '⭐'.repeat(Math.round(stars));
  if(c.mood >= 85){ const tip = c.type==='vip' ? 15000 : c.type==='jinsang' ? 10000 : 2000;
    S.money += tip; S.ds.revenue += tip; S.total.revenue += tip;
    text = c.type==='vip' ? '👑 최고야! 팁 +15,000' : c.type==='jinsang' ? '👿→😊 의외로 통 큰 팁 +10,000' : '💕 팁 +2,000'; }
  else if(c.mood < 45) text = '😒 ' + text;
  if(extra) text = extra + ' ' + text;
  leaveWalk(c, text);
  updateHUD();
}
function angryLeave(c){
  const milk = c.wishes[c.idx]==='milk';
  removeFromQueue(c);
  if(milk){ c.mood -= 15; depart(c, '🥛없네…'); return; }
  const aw = c.type==='vip' ? .3 : c.type==='jinsang' ? .24 : .16;
  S.rep = S.rep*(1-aw) + 1*aw;
  S.ds.angry++; S.total.angry++;
  c.angry = true; sfx.bad();
  leaveWalk(c, c.type==='vip' ? '👑😤 다신 안 와!' : c.type==='jinsang' ? '👿 인터넷에 후기 올린다!' : '😡 너무 오래 기다렸잖아!');

}

/* ======================= 게임 루프 ======================= */
// 평판이 좋으면 손님이 더 자주 와요 (평판 3 = 보통, 5 = 약 1.4배, 1.5 = 약 0.8배)
function repSpawnMul(){ return clamp(1 - (S.rep - 3) * .15, .7, 1.3); }
function tick(dt){
  if(S.phase==='day'){
    S.time += dt; S.spawnT -= dt;
    if(S.spawnT <= 0){
      spawn();
      const wz = (S.umbrella && WEATHER[S.weather].fx) ? WEATHER.cloudy.spawn : WEATHER[S.weather].spawn;
      S.spawnT = rnd(wz[0], wz[1]) * repSpawnMul(); // 날씨와 평판에 따라 손님 수가 달라짐
    }
    if(S.time >= DAY_LEN) startClosing();
  }
  let busy = 0;
  for(const k in FAC){
    const d = FAC[k], f = S.fac[k];
    if(d.range){
      const occ = f.slots.filter(Boolean).length;
      f.temp += d.drift * dt * (1 + occ*.15) + rnd(-.15,.15)*dt;
      const auto = (k==='warm' && S.upg.boiler) || (k==='cold' && S.upg.chiller);
      if(auto){ const mid = (d.range[0]+d.range[1])/2; f.temp += (mid - f.temp) * 1.2 * dt; }
      f.temp = clamp(f.temp, 5, 50);
    }
    f.slots.forEach((s,i) => {
      if(!s) return; busy++;
      if(s.me){ s.t += dt; if(s.t >= d.time) finishMe(k, i); return; }
      if(!s.arrived){ if(s.c.path.length) return; s.arrived = true; s.c.tag.dataset.m = 's'; }
      s.t += dt;
      const off = Math.abs(tempOff(k));
      const pick2 = s.c.type==='vip' ? 1.7 : 1;  // VIP는 까다로워요
      if(off>0) s.c.mood -= off * 1.6 * dt * pick2;
      if(f.clean < (s.c.type==='vip' ? 80 : 60)) s.c.mood -= ((s.c.type==='vip' ? 80 : 60) - f.clean) * .035 * dt * pick2;
      f.clean = Math.max(0, f.clean - .22*dt * (s.c.type==='jinsang' ? 3 : 1) * (S.buff.basin ? .5 : 1)); // 진상은 엄청 어지럽혀요
      if(s.t >= d.time) finishService(k, i);
    });
  }
  if(S.upg.cleaner){
    S.cleanT -= dt;
    if(S.cleanT <= 0){
      const dirty = Object.keys(FAC).filter(k=>S.fac[k].clean<60).sort((a,b)=>S.fac[a].clean-S.fac[b].clean)[0];
      if(dirty){ S.fac[dirty].clean = Math.min(100, S.fac[dirty].clean+40); pop(F[dirty].plate,'🧹 이모님 청소'); }
      S.cleanT = 3.5;
    }
  }
  if(S.role==='customer') autoManage();
  for(const c of [...S.queue]){
    if(c.type==='jinsang'){
      c.yellT -= dt * (S.buff.aroma && !c.yelling ? .5 : 1);
      if(!c.yelling && c.yellT <= 0){ c.yelling = true; c.tWish.textContent = wishText(c); sfx.bad(); pop(c.tag, '👿 왜 이렇게 느려!!', true); c.yellT = 2; }
      if(c.yelling && c.yellT <= 0){ c.yellT = 2; S.queue.forEach(o => { if(o!==c){ o.patience -= 1.5; } }); pop(F.bench, '😣 시끄러워…', true); }
    }
    if(ADMIN.noPatience){ c.patience = c.maxP; continue; }
    c.patience -= dt * (S.buff.mat ? .75 : 1);
    if(c.patience/c.maxP < .5) c.mood -= 1.3*dt;
    if(c.patience <= 0) angryLeave(c);
  }
  if(S.phase==='closing' && busy===0) endDay();
}
function animate(dt){
  // 자리 배정
  S.queue.forEach((c,i) => { if(c.seatIdx!==i){ c.seatIdx = i; sendTo(c, SEATS[i], null); } });
  for(const c of S.people){
    let e = 'neutral';
    if(c.loc==='leave') e = c.angry ? 'angry' : c.mood >= 60 ? 'happy' : 'sad';
    else if(c.loc==='queue' && (c.patience/c.maxP < .25 || c.yelling)) e = 'angry';
    else if(c.type==='jinsang') e = 'sad';
    else if(c.loc==='svc' && !c.path.length && c.mood > 85) e = 'happy';
    setExpr(c.p, e);
    moveCustomer(c, dt);
    if(c.aura){ c.aura.rotation.z += dt*2; c.aura.scale.setScalar(1 + Math.sin(T*4)*.08); }
    if(c.yelling && c.loc==='queue') c.p.g.position.y += Math.abs(Math.sin(T*14))*.12;
  }
  for(const c of S.people.filter(c => c.gone)){ removePerson(c.p); c.tag.remove(); }
  S.people = S.people.filter(c => !c.gone);
  // NPC
  for(const n of W.npcs){
    const p = n.p;
    if(n.type==='seshin'){
      setPose(p, 'stand', dt);
      const busyBed = S.fac.scrub.slots[n.i] && S.fac.scrub.slots[n.i].arrived;
      if(busyBed){ p.armL.rotation.x = -1.2 + Math.sin(T*12)*.35; p.armR.rotation.x = -1.2 - Math.sin(T*12)*.35; }
    } else if(n.type==='wash'){
      setPose(p, 'sit', dt); p.armR.rotation.x = -2.4 + Math.sin(T*6)*.5; p.armL.rotation.x = -1.0;
    } else if(n.type==='browse'){
      setPose(p, 'stand', dt); const r = Math.sin(T*.7 + n.ph); p.head.rotation.y = Math.sin(T*.45 + n.ph)*.5; p.armR.rotation.x = r > .55 ? -1.7 : 0;
    } else if(n.type==='owner'){
      setPose(p, 'stand', dt); p.head.rotation.y = Math.sin(T*.7)*.4; p.armR.rotation.z = Math.sin(T*1.3)>0.92 ? .9 : 0;
    }
  }
  updateParkingGate(dt);
}
function render3D(dt){
  // 물 색, 물결
  for(const k of ['warm','cold']){
    const w = W.water[k], off = tempOff(k), f = S.fac[k];
    const c = w.base.clone();
    if(k==='warm'){ if(off>0) c.lerp(new THREE.Color('#ff4a2a'), clamp(off/6,0,1)); if(off<0) c.lerp(new THREE.Color('#f2d6c2'), clamp(-off/8,0,1)); }
    else { if(off>0) c.lerp(new THREE.Color('#a9d6d2'), clamp(off/8,0,1)); if(off<0) c.lerp(new THREE.Color('#2f7fc0'), clamp(-off/6,0,1)); }
    c.lerp(new THREE.Color('#7f8f4a'), clamp((60-f.clean)/120, 0, .45));
    w.mat.color.copy(c);
    w.tex.offset.x += dt*.03; w.tex.offset.y += dt*.015;
  }
  for(const k in FAC) W.dirt[k].opacity = clamp((70 - S.fac[k].clean)/70, 0, 1) * .8;
  // 김
  const warmI = clamp((S.fac.warm.temp - 30)/12, .15, 1.3);
  for(const st of W.steam){
    const fr = (T*st.sp + st.ph) % 1;
    st.s.position.y = st.y0 + fr*2.4;
    const sc = .8 + fr*1.6; st.s.scale.set(sc, sc, 1);
    if(st.k==='chimney'){
      st.s.position.set(st.x0 + fr*2.2 + Math.sin(fr*6+st.ph*9)*.3, st.y0 + fr*4, st.z0 + fr*.6);
      const cs = 1 + fr*2.4; st.s.scale.set(cs, cs, 1);
      st.s.material.opacity = Math.sin(fr*Math.PI) * .55; continue;
    }
    const inten = st.k==='warm' ? warmI : st.k==='sauna' ? 1 : .25;
    st.s.material.opacity = Math.sin(fr*Math.PI) * .38 * inten;
  }
  // 강조 패드
  const pulse = .25 + Math.sin(T*6)*.12;
  for(const k in W.glow) if(W.glow[k].visible) W.glow[k].material.opacity = pulse;
  // 우유
  W.bottles.forEach((b,i) => b.visible = i < S.milk.stock);
  W.saunaLight.intensity = .8 + Math.sin(T*3.1)*.12 + Math.sin(T*7.3)*.06;
  W.fan.rotation.z += dt*8;
  updateWeather(dt);
  W.clockHand.rotation.z = -(S.time/DAY_LEN)*Math.PI*2*16/12;
  // 선택 링
  if(selected){ W.selRing.visible = true; W.selRing.position.set(selected.p.g.position.x, .03, selected.p.g.position.z + (selected.path.length?0:.25)); W.selRing.scale.setScalar(1 + Math.sin(T*8)*.08); }
  else W.selRing.visible = false;
}

function updateCamera(){

}
function loop(ts){
  const dt = Math.min(.1, (ts - last)/1000 || 0) * ADMIN.speed; last = ts;
  if(!S.paused){
    T += dt;
    if(S.phase==='day' || S.phase==='closing') tick(dt);
    animate(dt);
    updatePlayer(dt);
    render3D(dt);
    updatePets(dt);
    updateTraffic(dt);
    updateSeoul(dt);
  }
  updateCamera();
  followSun();
  renderer.render(scene, camera);
  renderLabels(); renderPanel();
  requestAnimationFrame(loop);
}

  const u = UPG.find(x=>x.id===id), lv = S.upg[id], cost = u.cost(lv);

      <li><b>👿 진상</b>: 인내심이 짧고 시설을 3배로 어지럽혀요. 💢 소리 지르면 다른 손님 인내심이 깎이니 얼른 눌러서(또는 E) 진정시키세요. 가끔 반값을 요구해요.</li>
      <li><b>🧖 손님 모드</b>: 지갑 50,000원으로 온탕·냉탕·사우나·때밀이·바나나우유 코스를 직접 즐겨요. 시설 가까이에서 E! 개운함 점수를 높이면 이겨요.</li>
      <li><b>🏪 편의점</b>: 문 앞에서 E로 들어가 진열대에서 E로 장바구니에 담고, 계산대에서 E로 계산해요.</li>
      <li><b>🛍️ 천원샵</b>: 편의점 왼쪽! 사장님은 때수건·대야·미끄럼 매트 같은 <b>영업 도우미</b>, 손님은 양머리 수건·목욕 오리 같은 <b>개운함 아이템</b>이 진열돼요. 효과는 그날 하루 (밤에 사면 다음 날까지).</li>
      <li><b>🐾 펫샵</b>: 천원샵 왼쪽! 강아지·고양이·햄스터를 입양하면 졸졸 따라다녀요. 사장님은 <b>가게 고양이</b>(대기 손님 인내심 +15%)와 <b>대기실 어항</b>(만족도 +5)을 들일 수 있어요.</li>
      <li><b>🅿️ 주차장</b>: 행복아파트 오른쪽. 차로 다가가면 차단기가 올라가요. 빈 칸에 세우고 내리면 주차 완료!</li>
      <li><b>🏙️ 프리미엄 타워</b>: 펜트하우스를 살 수 있어요 (사장 100만 원 · 손님 특가 15만 원). 자쿠지와 킹 침대! 여기서 자면 프리미엄 숙면 보너스.</li>
      <li><b>🏠 우리 집</b>: 영업이 끝나면 밤이 돼요. 오른쪽 행복아파트 문 앞에서 E로 들어가 침대에서 E를 누르면 자고, 다음 날 아침에 일어나요.</li>
      <li><b>🚗 내 차</b>: 앞 도로의 초록 차 근처에서 E로 타고, WASD로 운전, 다시 E로 내려요. H는 경적!</li>
      <li><b>날씨</b>가 매일 바뀌어요. ☀️ 맑으면 손님이 10초에 3명꼴로 몰려오고, ☁️ 흐리면 보통, 🌧️ 비나 ❄️ 눈이 오면 손님이 적어요.</li>
      <li>목욕 후 <b>🍌🥛</b>를 찾는 손님에겐 냉장고를 눌러 팔아요.</li>
      <li>목욕탕 왼쪽 거리의 <b>🏪 편의점</b>에서 우유·세제·맥반석 계란·식혜·우산을 살 수 있어요.</li>
      <li><b>WASD</b>(또는 방향키)로 사장님을 직접 움직여요. <b>Shift</b>를 누르면 달려요. 손님이나 시설 가까이에서 <b>E</b>를 누르면 안내·판매, <b>R</b>은 청소, <b>F</b>는 온도 조절이에요. 휴대폰은 왼쪽 아래 조이스틱과 E 버튼을 써요.</li>
      <li><b>시점</b>: 화면을 끌면 360도 돌리고 위아래 각도도 바뀌어요. 우클릭(또는 Shift)+드래그로 카메라 이동, 휠로 확대. 휴대폰은 한 손가락으로 회전, 두 손가락으로 확대·이동. ⟲ 버튼은 원래 시점으로 돌아가요.</li>
    </ul>`,
    [['🧑‍💼 사장으로 시작', () => startRole('owner'), 'primary'], ['🧖 손님으로 시작', () => startRole('customer'), 'primary']]);
}

/* ======================= 시작 ======================= */
function resize(){
  const st = $('#stage');
  stageW = st.clientWidth; stageH = st.clientHeight;
  renderer.setSize(stageW, stageH, false);
  camera.aspect = stageW / stageH; camera.updateProjectionMatrix();
}
function setupInput(){
  const cv = renderer.domElement, ray = new THREE.Raycaster(), m = new THREE.Vector2();
  const ptrs = new Map();
  let g = null; // 제스처 상태
  const ZMIN = .25, ZMAX = 2.6;
  const camR = () => Math.max(21, 31/(stageW/stageH)) * cam.zoom;
  function panBy(dx, dy){
    const k = camR() * .0017, sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw);
    cam.target.x += (-dx*cy - dy*sy) * k;
    cam.target.z += ( dx*sy - dy*cy) * k;
    cam.target.x = clamp(cam.target.x, -40, 40); cam.target.z = clamp(cam.target.z, -30, 20);
    PLAYER.follow = false;
  }
  function start(){
    const pts = [...ptrs.values()];
    if(pts.length===1){
      const p = pts[0];
      g = {mode: (p.button===2 || p.shift) ? 'pan' : 'rot', x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false};
    } else if(pts.length>=2){
      const [a,b] = pts;
      g = {mode:'pinch', d:Math.hypot(a.x-b.x, a.y-b.y), mx:(a.x+b.x)/2, my:(a.y+b.y)/2, moved:true, zoom:cam.zoom};
    }
  }
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY, button:e.button, shift:e.shiftKey});
    start();
  });
  cv.addEventListener('pointermove', e => {
    if(!ptrs.has(e.pointerId) || !g) return;
    const p = ptrs.get(e.pointerId); p.x = e.clientX; p.y = e.clientY;
    if(g.mode==='pinch'){
      const [a,b] = [...ptrs.values()]; if(!b) return;
      const d = Math.hypot(a.x-b.x, a.y-b.y), mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      cam.zoom = clamp(g.zoom * g.d / Math.max(20, d), ZMIN, ZMAX);
      panBy(mx - g.mx, my - g.my); g.mx = mx; g.my = my;
      return;
    }
    const dx = p.x - g.x, dy = p.y - g.y; g.x = p.x; g.y = p.y;
    if(Math.abs(p.x-g.sx) + Math.abs(p.y-g.sy) > 6) g.moved = true;
    if(!g.moved) return;
    if(g.mode==='rot'){
      cam.yaw -= dx * .007;                                   // 360도 자유 회전
      cam.pitch = clamp(cam.pitch + dy * .005, .12, 1.48);    // 거의 바닥 높이 ~ 바로 위
    } else panBy(dx, dy);
  });
  const up = e => {
    const wasTap = g && !g.moved && ptrs.size===1;
    if(wasTap){
      const r = cv.getBoundingClientRect();
      m.set(((e.clientX - r.left)/r.width)*2-1, -((e.clientY - r.top)/r.height)*2+1);
      ray.setFromCamera(m, camera);
      const hits = ray.intersectObjects(scene.children, true);
      for(const h of hits){
        const pk = h.object.userData.pick; if(!pk) continue;
        if(pk.cid){ const c = S.people.find(x => x.id===pk.cid); if(c && c.loc==='queue'){ clickCustomer(c); break; } continue; }
        if(pk.k){ clickFacility(pk.k); break; }
      }
    }
    ptrs.delete(e.pointerId);
    if(ptrs.size) start(); else g = null;
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); if(ptrs.size) start(); else g = null; });
  cv.addEventListener('wheel', e => { e.preventDefault(); cam.zoom = clamp(cam.zoom * (1 + e.deltaY*.001), ZMIN, ZMAX); }, {passive:false});
  // 키보드로도 시점 조절: Q/E 대신 Z·C 회전, T·G 높이, +/- 확대
  window.addEventListener('keydown', e => {
    if(modalOpen()) return;
    if(e.code==='KeyZ') cam.yaw += .12;
    if(e.code==='KeyC') cam.yaw -= .12;
    if(e.code==='KeyT') cam.pitch = clamp(cam.pitch + .08, .12, 1.48);
    if(e.code==='KeyG') cam.pitch = clamp(cam.pitch - .08, .12, 1.48);
    if(e.code==='Equal' || e.code==='NumpadAdd') cam.zoom = clamp(cam.zoom*.9, ZMIN, ZMAX);
    if(e.code==='Minus' || e.code==='NumpadSubtract') cam.zoom = clamp(cam.zoom/.9, ZMIN, ZMAX);
  });
  $('#zin').addEventListener('click', () => cam.zoom = clamp(cam.zoom*.85, ZMIN, ZMAX));
  $('#zout').addEventListener('click', () => cam.zoom = clamp(cam.zoom/.85, ZMIN, ZMAX));
  $('#zreset').addEventListener('click', () => { cam.yaw = .32; cam.pitch = .92; cam.zoom = 1; PLAYER.follow = true; });
}
function init(){
  if(!window.THREE){ $('#loading').innerHTML = '3D 엔진(Three.js)을 불러오지 못했어요 😢<br><small>인터넷 연결을 확인하고 새로고침해 주세요.</small>'; return; }
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  $('#stage').prepend(renderer.domElement);
  scene = new THREE.Scene();
  scene.background = new THREE.Color('#bfe3f2');
  scene.fog = new THREE.Fog('#bfe3f2', 60, 230);
  camera = new THREE.PerspectiveCamera(38, 1, .1, 400);
  cam.target = new THREE.Vector3(-.3, 0, .1);
  W.hemi = new THREE.HemisphereLight('#fff7ea', '#9fb3ba', .72); scene.add(W.hemi);
  const sun = new THREE.DirectionalLight('#fff1dc', .62);
  sun.position.set(7, 18, 11); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, {left:-24, right:24, top:22, bottom:-22, near:1, far:70});
  sun.shadow.bias = -.0008;
  scene.add(sun); scene.add(sun.target); W.sun = sun;
  scene.add(new THREE.AmbientLight('#ffffff', .18));
  buildWorld();
  buildWeatherFx();
  buildPlayer();
  buildMyCar();
  buildStoreInterior();
  buildDaisoInterior();
  buildPetShopInterior();
  buildBathPets();
  buildPlayerExtras();
  buildCompanions();
  buildTraffic();
  buildPremium();
  newGame();
  buildUI();
  resize(); window.addEventListener('resize', resize);
  setupInput();
  setupPlayerInput();
  $('#signBtn').addEventListener('click', signClicked);
  $('#adminBtn').addEventListener('click', openAdmin);
  adminLoad();
  $('#pauseBtn').addEventListener('click', () => {
    if(S.phase!=='day' && S.phase!=='closing') return;
    S.paused = true;
    showModal(`<h2>⏸ 잠깐 쉬는 중</h2><p>평상에 앉아 식혜 한 잔 🍹</p>`, [['계속하기', ()=>{ S.paused=false; hideModal(); }, 'primary']]);
  });
  $('#soundBtn').addEventListener('click', () => { sound = !sound; $('#soundBtn').textContent = sound ? '🔊' : '🔇'; });
  document.addEventListener('keydown', e => { if(e.key==='Escape') setSelected(null); });
  $('#loading').remove();
  showTitle();
  requestAnimationFrame(loop);
}
const fontsReady = document.fonts && document.fonts.load ? Promise.race([document.fonts.load('40px Jua'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.then(init, init);
</script>
